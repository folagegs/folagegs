<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<title>Hitman Contract</title>
<style>
  :root {
    --text: #f4f2ff;
    --text-dim: #a8a4c2;
    --accent: #ffb020;
    --accent2: #ff6a3d;
    --gold: #4ade80;
    --panel: rgba(16, 14, 26, 0.92);
    --card: rgba(255,255,255,0.05);
    --card-border: rgba(255,255,255,0.09);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    overflow: hidden;
    background: #0c0e1a;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    touch-action: none;
    color: var(--text);
  }
  #app { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
  #stage {
    position: relative;
    width: 100%; height: 100%;
    max-width: 480px; max-height: 900px;
    background: #05060c;
    overflow: hidden;
  }
  canvas { display: block; width: 100%; height: 100%; }

  .loading { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; z-index: 20; color: var(--text-dim); font-size: 13px; letter-spacing: 1px; }

  .hud { position: absolute; top: 0; left: 0; right: 0; padding: 16px 18px; display: flex; justify-content: space-between; align-items: flex-start; pointer-events: none; z-index: 5; display: none; }
  .cash-pill { display: flex; align-items: center; gap: 6px; background: rgba(10,8,18,0.55); border: 1px solid rgba(255,255,255,0.12); border-radius: 999px; padding: 7px 14px 7px 8px; }
  .cash-icon { width: 18px; height: 18px; border-radius: 50%; background: var(--gold); display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 900; color: #0a2f16; }
  .cash-val { font-weight: 800; font-size: 15px; }
  .contract-pill { background: rgba(10,8,18,0.55); border: 1px solid rgba(255,255,255,0.12); border-radius: 999px; padding: 7px 16px; font-size: 12px; font-weight: 800; letter-spacing: 0.5px; text-align: center; }
  .contract-pill .room { display: block; font-size: 10px; color: var(--text-dim); font-weight: 600; margin-top: 2px; }
  .hp-wrap { display: flex; align-items: center; gap: 6px; background: rgba(10,8,18,0.55); border: 1px solid rgba(255,255,255,0.12); border-radius: 999px; padding: 7px 12px; margin-top: 7px; }
  .hp-bar { width: 84px; height: 9px; border-radius: 5px; background: rgba(255,255,255,0.12); overflow: hidden; }
  .hp-fill { height: 100%; background: linear-gradient(90deg,#ff4d6d,#ff8a3d); transition: width 0.2s; }
  .hp-icon { font-size: 11px; }

  .controls { position: absolute; inset: 0; z-index: 8; display: none; }
  .joy-zone { position: absolute; left: 0; top: 0; width: 100%; height: 100%; }
  .joy-base { position: absolute; width: 104px; height: 104px; margin-left: -52px; margin-top: -52px; border-radius: 50%; background: rgba(255,255,255,0.07); border: 2px solid rgba(255,255,255,0.16); display: none; pointer-events: none; }
  .joy-knob { position: absolute; width: 46px; height: 46px; margin-left: -23px; margin-top: -23px; border-radius: 50%; background: rgba(255,176,32,0.4); border: 2px solid rgba(255,176,32,0.7); pointer-events: none; }
  #jumpBtn {
    position: absolute; right: 22px; bottom: calc(28px + env(safe-area-inset-bottom, 0px));
    width: 74px; height: 74px; border-radius: 50%; border: none; pointer-events: auto; user-select: none;
    font-family: inherit; font-weight: 800; font-size: 12px; color: #1a0c04;
    background: linear-gradient(135deg,var(--accent),var(--accent2));
    box-shadow: 0 8px 20px rgba(255,106,61,0.45);
  }
  #jumpBtn:active { transform: scale(0.92); }

  .popup { position: absolute; font-weight: 900; font-size: 17px; color: var(--gold); text-shadow: 0 0 10px rgba(74,222,128,0.6); pointer-events: none; z-index: 7; transform: translate(-50%,-50%); }
  .flash { position: absolute; inset: 0; background: #ff2d44; opacity: 0; pointer-events: none; z-index: 6; }

  .overlay { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; text-align: center; padding: 28px; z-index: 10; background: radial-gradient(circle at 50% 30%, rgba(255,106,61,0.16), transparent 60%), rgba(6,5,12,0.6); }
  .overlay.hidden { display: none; }
  .title { font-size: 34px; font-weight: 900; letter-spacing: 0.5px; background: linear-gradient(90deg,var(--accent),var(--accent2)); -webkit-background-clip: text; background-clip: text; color: transparent; margin: 0; }
  .subtitle { color: var(--text-dim); font-size: 13.5px; font-weight: 500; max-width: 300px; line-height: 1.55; margin: 0; }

  .target-card { display: flex; align-items: center; gap: 12px; background: var(--card); border: 1px solid var(--card-border); border-radius: 16px; padding: 12px 20px; }
  .target-portrait { width: 48px; height: 48px; border-radius: 50%; background: #2a1030; display: flex; align-items: center; justify-content: center; font-size: 22px; border: 2px solid var(--accent2); }
  .target-info { text-align: left; }
  .target-label { font-size: 10px; letter-spacing: 1.5px; color: var(--text-dim); font-weight: 800; text-transform: uppercase; }
  .target-name { font-size: 15px; font-weight: 800; }

  .btn { appearance: none; border: none; outline: none; cursor: pointer; font-family: inherit; font-weight: 800; font-size: 16px; letter-spacing: 0.3px; color: #1a0c04; background: linear-gradient(135deg,var(--accent),var(--accent2)); padding: 13px 38px; border-radius: 999px; box-shadow: 0 8px 22px rgba(255,106,61,0.4), 0 0 0 1px rgba(255,255,255,0.08) inset; transition: transform 0.12s ease; }
  .btn:active { transform: scale(0.95); }
  .btn.ghost { background: rgba(255,255,255,0.08); color: var(--text); box-shadow: none; border: 1px solid rgba(255,255,255,0.15); font-size: 13px; padding: 10px 24px; }
  .btn:disabled { opacity: 0.35; filter: grayscale(0.6); }
  .btn-row { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }

  .equip-grid { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; max-width: 360px; }
  .weapon-card { width: 104px; background: var(--card); border: 2px solid var(--card-border); border-radius: 16px; padding: 12px 8px; display: flex; flex-direction: column; align-items: center; gap: 6px; cursor: pointer; font-family: inherit; color: var(--text); }
  .weapon-card.selected { border-color: var(--accent); background: rgba(255,176,32,0.1); }
  .weapon-card:disabled { opacity: 0.4; cursor: default; }
  .weapon-icon { font-size: 26px; }
  .weapon-name { font-size: 11.5px; font-weight: 800; }
  .weapon-cost { font-size: 11px; font-weight: 700; color: var(--gold); }
  .weapon-cost.free { color: var(--text-dim); }

  .hero-grid { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; max-width: 320px; }
  .hero-card { width: 64px; height: 64px; border-radius: 16px; border: 3px solid transparent; cursor: pointer; display: flex; align-items: center; justify-content: center; }
  .hero-card.selected { border-color: var(--accent); }
  .hero-card .swatch { width: 40px; height: 40px; border-radius: 10px; }

  .panel { background: var(--panel); border: 1px solid rgba(255,255,255,0.08); border-radius: 20px; padding: 24px 28px; backdrop-filter: blur(6px); display: flex; flex-direction: column; align-items: center; gap: 10px; max-width: 340px; }
  .result-label { font-size: 12px; letter-spacing: 2px; text-transform: uppercase; color: var(--text-dim); font-weight: 700; }
  .result-cash { font-size: 44px; font-weight: 900; color: var(--gold); line-height: 1; }
  .cash-balance { font-size: 11px; color: var(--text-dim); font-weight: 600; }
</style>
</head>
<body>
<div id="app">
  <div id="stage">
    <canvas id="game"></canvas>
    <div class="loading" id="loading">LOADING 3D ENGINE...</div>
    <div class="flash" id="flash"></div>
    <div id="popupLayer"></div>

    <div class="hud" id="hud">
      <div>
        <div class="cash-pill"><div class="cash-icon">$</div><div class="cash-val" id="cashVal">0</div></div>
        <div class="hp-wrap"><div class="hp-icon">❤️</div><div class="hp-bar"><div class="hp-fill" id="hpFill" style="width:100%;"></div></div></div>
      </div>
      <div class="contract-pill">CONTRACT <span id="contractNum">1</span><span class="room" id="roomVal">Room 1/3</span></div>
    </div>

    <div class="controls" id="controls">
      <div class="joy-zone" id="joyZone"></div>
      <div class="joy-base" id="joyBase"><div class="joy-knob" id="joyKnob"></div></div>
      <button id="jumpBtn">JUMP</button>
    </div>

    <div class="overlay hidden" id="titleOverlay">
      <h1 class="title">HITMAN CONTRACT</h1>
      <p class="subtitle">Clear every room, collect the cash, gear up before each job.</p>
      <div class="target-card">
        <div class="target-portrait" id="targetPortrait">🎩</div>
        <div class="target-info">
          <div class="target-label">Contract <span id="titleContractNum">1</span></div>
          <div class="target-name" id="targetName">Street Crew</div>
        </div>
      </div>
      <div class="btn-row">
        <button class="btn" id="playBtn">PLAY</button>
      </div>
      <button class="btn ghost" id="heroesBtn" style="margin-top:4px;">HEROES</button>
    </div>

    <div class="overlay hidden" id="heroesOverlay">
      <h1 class="title" style="font-size:26px;">HEROES</h1>
      <p class="subtitle">Pick your look. Purely cosmetic — same stats.</p>
      <div class="hero-grid" id="heroGrid"></div>
      <button class="btn ghost" id="heroesBackBtn">BACK</button>
    </div>

    <div class="overlay hidden" id="equipOverlay">
      <h1 class="title" style="font-size:24px;">CHOOSE EQUIPMENT</h1>
      <p class="subtitle" style="margin-bottom:-4px;">Only for this contract</p>
      <div class="cash-pill" style="margin-bottom:4px;"><div class="cash-icon">$</div><div class="cash-val" id="equipCash">0</div></div>
      <div class="equip-grid" id="equipGrid"></div>
      <div class="btn-row">
        <button class="btn" id="continueBtn">CONTINUE</button>
      </div>
      <button class="btn ghost" id="equipBackBtn">BACK</button>
    </div>

    <div class="overlay hidden" id="resultOverlay">
      <div class="panel">
        <div class="result-label" id="resultLabel">Contract Complete</div>
        <div class="result-cash" id="resultCash">+0</div>
        <div class="cash-balance" id="resultBalance">Balance: 0</div>
        <div class="btn-row" style="margin-top:6px;">
          <button class="btn" id="primaryBtn">NEXT CONTRACT</button>
        </div>
        <button class="btn ghost" id="homeBtn">HOME</button>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script>
(function () {
  "use strict";

  var stage = document.getElementById("stage");
  var canvas = document.getElementById("game");
  var loadingEl = document.getElementById("loading");
  var hud = document.getElementById("hud");
  var cashVal = document.getElementById("cashVal");
  var contractNum = document.getElementById("contractNum");
  var roomVal = document.getElementById("roomVal");
  var flashEl = document.getElementById("flash");
  var popupLayer = document.getElementById("popupLayer");
  var controlsEl = document.getElementById("controls");
  var joyZone = document.getElementById("joyZone");
  var joyBase = document.getElementById("joyBase");
  var joyKnob = document.getElementById("joyKnob");
  var jumpBtn = document.getElementById("jumpBtn");

  var titleOverlay = document.getElementById("titleOverlay");
  var heroesOverlay = document.getElementById("heroesOverlay");
  var equipOverlay = document.getElementById("equipOverlay");
  var resultOverlay = document.getElementById("resultOverlay");
  var targetPortrait = document.getElementById("targetPortrait");
  var targetName = document.getElementById("targetName");
  var titleContractNum = document.getElementById("titleContractNum");
  var heroGrid = document.getElementById("heroGrid");
  var equipGrid = document.getElementById("equipGrid");
  var equipCash = document.getElementById("equipCash");
  var resultLabel = document.getElementById("resultLabel");
  var resultCash = document.getElementById("resultCash");
  var resultBalance = document.getElementById("resultBalance");
  var primaryBtn = document.getElementById("primaryBtn");

  var playBtn = document.getElementById("playBtn");
  var heroesBtn = document.getElementById("heroesBtn");
  var heroesBackBtn = document.getElementById("heroesBackBtn");
  var continueBtn = document.getElementById("continueBtn");
  var equipBackBtn = document.getElementById("equipBackBtn");
  var homeBtn = document.getElementById("homeBtn");

  if (typeof THREE === "undefined") {
    loadingEl.textContent = "Couldn't load the 3D engine. Check your connection and reload.";
    return;
  }

  // ================= Data =================
  var WEAPONS = [
    { key: "katana", name: "Katana", icon: "⚔️", cost: 0, kind: "melee", range: 1.5, damage: 1, cooldown: 0.36 },
    { key: "pistol", name: "Pistol", icon: "🔫", cost: 200, kind: "ranged", range: 6.5, damage: 1, cooldown: 0.46, projSpeed: 16 },
    { key: "shotgun", name: "Shotgun", icon: "🔫", cost: 450, kind: "spread", range: 4.8, damage: 1, cooldown: 0.72, projSpeed: 17, pellets: 3 },
    { key: "ak47", name: "AK47", icon: "🔫", cost: 700, kind: "ranged", range: 7.5, damage: 1, cooldown: 0.12, projSpeed: 20 },
    { key: "rpg", name: "RPG", icon: "💥", cost: 700, kind: "splash", range: 8.5, damage: 3, cooldown: 1.1, projSpeed: 12, splashRadius: 2.5 },
    { key: "minigun", name: "Minigun", icon: "🔫", cost: 1400, kind: "ranged", range: 9, damage: 1, cooldown: 0.065, projSpeed: 23 }
  ];

  var TARGET_NAMES = ["Street Crew", "Warehouse Gang", "Office Syndicate", "Smuggler Ring", "Casino Bosses", "Penthouse Cartel"];
  var HERO_COLORS = [0xff8a3d, 0x4ef0e0, 0xff4d6d, 0xb06bff, 0x4ade80];

  var CASH_KEY = "hitmanContractCash";
  var CONTRACT_KEY = "hitmanContractNum";
  var HERO_KEY = "hitmanContractHero";
  var cash = 0, contractNumber = 1, heroIndex = 0;
  try { cash = parseInt(localStorage.getItem(CASH_KEY), 10) || 0; } catch (e) {}
  try { contractNumber = parseInt(localStorage.getItem(CONTRACT_KEY), 10) || 1; } catch (e) {}
  try { heroIndex = parseInt(localStorage.getItem(HERO_KEY), 10) || 0; } catch (e) {}

  function saveMeta() {
    try {
      localStorage.setItem(CASH_KEY, String(cash));
      localStorage.setItem(CONTRACT_KEY, String(contractNumber));
      localStorage.setItem(HERO_KEY, String(heroIndex));
    } catch (e) {}
  }

  function contractConfig(n) {
    return {
      rooms: Math.min(3 + Math.floor(n / 2), 6),
      enemiesPerRoom: Math.min(2 + Math.floor(n / 3), 5),
      enemyHp: 1 + Math.floor((n - 1) / 3),
      enemySpeedMul: 1 + (n - 1) * 0.04
    };
  }

  function updateTitleScreen() {
    titleContractNum.textContent = contractNumber;
    targetName.textContent = TARGET_NAMES[(contractNumber - 1) % TARGET_NAMES.length];
    cashVal.textContent = cash;
  }

  function buildHeroGrid() {
    var html = "";
    for (var i = 0; i < HERO_COLORS.length; i++) {
      var c = "#" + HERO_COLORS[i].toString(16).padStart(6, "0");
      html += '<button class="hero-card ' + (i === heroIndex ? "selected" : "") + '" data-i="' + i + '"><div class="swatch" style="background:' + c + '"></div></button>';
    }
    heroGrid.innerHTML = html;
    heroGrid.querySelectorAll(".hero-card").forEach(function (b) {
      b.addEventListener("click", function () {
        heroIndex = parseInt(b.getAttribute("data-i"), 10);
        saveMeta();
        buildHeroGrid();
        if (player.vis) applyHeroColor();
      });
    });
  }

  var selectedWeapon = "katana";
  function buildEquipGrid() {
    equipCash.textContent = cash;
    var html = "";
    WEAPONS.forEach(function (w) {
      var affordable = cash >= w.cost;
      var sel = selectedWeapon === w.key;
      html += '<button class="weapon-card ' + (sel ? "selected" : "") + '" data-key="' + w.key + '" ' + (!affordable ? "disabled" : "") + '>' +
        '<div class="weapon-icon">' + w.icon + '</div>' +
        '<div class="weapon-name">' + w.name + '</div>' +
        '<div class="weapon-cost ' + (w.cost === 0 ? "free" : "") + '">' + (w.cost === 0 ? "FREE" : "$" + w.cost) + '</div>' +
        '</button>';
    });
    equipGrid.innerHTML = html;
    equipGrid.querySelectorAll(".weapon-card:not([disabled])").forEach(function (b) {
      b.addEventListener("click", function () {
        selectedWeapon = b.getAttribute("data-key");
        buildEquipGrid();
      });
    });
  }

  function showOverlay(el) {
    [titleOverlay, heroesOverlay, equipOverlay, resultOverlay].forEach(function (o) { o.classList.add("hidden"); });
    el.classList.remove("hidden");
  }

  function openTitle() {
    updateTitleScreen();
    showOverlay(titleOverlay);
    hud.style.display = "none"; controlsEl.style.display = "none";
  }
  function openHeroes() { buildHeroGrid(); showOverlay(heroesOverlay); }
  function openEquip() {
    selectedWeapon = "katana";
    buildEquipGrid();
    showOverlay(equipOverlay);
  }

  playBtn.addEventListener("click", openEquip);
  heroesBtn.addEventListener("click", openHeroes);
  heroesBackBtn.addEventListener("click", openTitle);
  equipBackBtn.addEventListener("click", openTitle);
  continueBtn.addEventListener("click", function () {
    var w = WEAPONS.filter(function (x) { return x.key === selectedWeapon; })[0];
    if (cash < w.cost) return;
    cash -= w.cost;
    saveMeta();
    startRun(w);
  });
  homeBtn.addEventListener("click", openTitle);

  // ================= Three.js setup =================
  var W = 0, H = 0, DPR = 1;

  var renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true });
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  var scene = new THREE.Scene();
  var camera = new THREE.PerspectiveCamera(48, 1, 0.1, 300);
  var ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
  var fillLight = new THREE.HemisphereLight(0x8899ff, 0x201018, 0.35);
  var sunLight = new THREE.DirectionalLight(0xffffff, 1.0);
  sunLight.position.set(6, 14, 7);
  sunLight.castShadow = true;
  sunLight.shadow.mapSize.set(1024, 1024);
  sunLight.shadow.camera.near = 2;
  sunLight.shadow.camera.far = 30;
  sunLight.shadow.camera.left = -10; sunLight.shadow.camera.right = 10;
  sunLight.shadow.camera.top = 10; sunLight.shadow.camera.bottom = -10;
  sunLight.shadow.camera.updateProjectionMatrix();
  sunLight.shadow.bias = -0.0015;
  scene.add(ambientLight, fillLight, sunLight, sunLight.target);
  scene.background = new THREE.Color(0x1a1830);
  scene.fog = new THREE.Fog(0x14101f, 14, 34);

  var worldGroup = new THREE.Group(); scene.add(worldGroup);
  var entitiesGroup = new THREE.Group(); scene.add(entitiesGroup);
  var fxGroup = new THREE.Group(); scene.add(fxGroup);

  function resize() {
    var rect = stage.getBoundingClientRect();
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = rect.width; H = rect.height;
    renderer.setPixelRatio(DPR);
    renderer.setSize(W, H, false);
    camera.aspect = W / H;
    camera.updateProjectionMatrix();
  }
  window.addEventListener("resize", resize);

  // ---- shared geometry ----
  var GEO_BOX = new THREE.BoxGeometry(1, 1, 1);
  var GEO_BOX_TOP = new THREE.BoxGeometry(1, 1, 1); GEO_BOX_TOP.translate(0, -0.5, 0);
  var GEO_CYL = new THREE.CylinderGeometry(0.5, 0.5, 1, 10);
  var GEO_CONE = new THREE.ConeGeometry(0.5, 1, 8);
  var GEO_SPHERE = new THREE.SphereGeometry(0.5, 10, 8);

  var matCache = {};
  function solidMat(hex, rough, metal) {
    var key = hex + "_" + rough + "_" + metal;
    if (!matCache[key]) matCache[key] = new THREE.MeshStandardMaterial({ color: hex, roughness: rough, metalness: metal });
    return matCache[key];
  }
  var STEEL_MAT = solidMat(0xdbe3f0, 0.3, 0.75);
  var DARK_MAT = solidMat(0x2a2432, 0.7, 0.15);

  function makeFloorTexture(baseHex, lineHex) {
    var c = document.createElement("canvas"); c.width = c.height = 128;
    var fc = c.getContext("2d");
    var base = "#" + baseHex.toString(16).padStart(6, "0");
    var line = "#" + lineHex.toString(16).padStart(6, "0");
    fc.fillStyle = base; fc.fillRect(0, 0, 128, 128);
    fc.fillStyle = "rgba(255,255,255,0.025)"; fc.fillRect(0, 0, 64, 128);
    fc.strokeStyle = line; fc.lineWidth = 3;
    fc.strokeRect(1.5, 1.5, 125, 125);
    var tex = new THREE.CanvasTexture(c);
    tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
    return tex;
  }

  function makeBlobShadow(radius) {
    var m = new THREE.Mesh(new THREE.CircleGeometry(radius, 16), new THREE.MeshBasicMaterial({ color: 0x000000, transparent: true, opacity: 0.32, depthWrite: false }));
    m.rotation.x = -Math.PI / 2;
    m.position.y = 0.015;
    return m;
  }

  // ---- character rig ----
  function seg(parent, length, width, mat, xOff) {
    var pivot = new THREE.Group(); pivot.position.set(xOff || 0, 0, 0); parent.add(pivot);
    var mesh = new THREE.Mesh(GEO_BOX_TOP, mat);
    mesh.scale.set(width, length, width * 0.82);
    pivot.add(mesh);
    var anchor = new THREE.Group(); anchor.position.set(0, -length, 0); pivot.add(anchor);
    return { pivot: pivot, anchor: anchor };
  }

  var CHAR_SCALE = 1.35;
  function createCharacter(skinColor, outfitColor, maskColor, bulky, weaponKey, accessory) {
    var sc = (bulky ? 1.15 : 1) * CHAR_SCALE;
    var skinMat = solidMat(skinColor, 0.75, 0.05);
    var outfitMat = solidMat(outfitColor, 0.7, 0.08);
    var maskMat = solidMat(maskColor, 0.8, 0.02);
    var eyeMat = solidMat(0xffffff, 0.3, 0.1);
    var accentMat = solidMat(accessory === "rusher" ? 0xff3344 : accessory === "gunner" ? 0x2a2e3a : maskColor, 0.6, 0.1);

    var hipY = 0.5 * sc, shoulderOff = 0.3 * sc, headOff = 0.13 * sc, headR = 0.095 * sc;
    var thighLen = 0.26 * sc, shinLen = 0.24 * sc, thighW = 0.085 * sc, shinW = 0.065 * sc;
    var armLen1 = 0.17 * sc, armLen2 = 0.16 * sc, armW1 = 0.065 * sc, armW2 = 0.05 * sc;
    var legXOff = 0.07 * sc;

    var root = new THREE.Group();
    var shadowMesh = makeBlobShadow(0.3 * sc);
    root.add(shadowMesh);

    var legHip = new THREE.Group(); legHip.position.set(0, hipY, 0); root.add(legHip);

    vis.legs.L.hip.rotation.x = back.thigh;
    vis.legs.L.knee.rotation.x = back.shin;
    vis.arms.L.shoulder.rotation.x = Math.sin(phase + Math.PI) * 0.45 * amp;
    vis.arms.L.elbow.rotation.x = Math.max(0, Math.sin(phase + Math.PI - 0.7)) * 0.5 * amp;

    if (swingPhase >= 0) {
      vis.arms.R.shoulder.rotation.x = -1.1 + swingPhase * 1.9;
      vis.arms.R.elbow.rotation.x = 0.3;
    } else {
      vis.arms.R.shoulder.rotation.x = 0.25 + Math.sin(phase) * 0.1 * amp;
      vis.arms.R.elbow.rotation.x = 0.4;

    vis.bob.position.y = (0.5 * vis.scaleVal) + Math.max(0, Math.sin(phase * 2)) * 0.02 * amp;

  function resolveObstacles(entity, r) {
    for (var i = 0; i < obstacles.length; i++) {
      var o = obstacles[i];
      var dx = entity.x - o.x, dz = entity.z - o.z;
      var dist = Math.sqrt(dx * dx + dz * dz);
      var minDist = r + o.r;
      if (dist > 0 && dist < minDist) {
        var push = (minDist - dist) / dist;
        entity.x += dx * push; entity.z += dz * push;
      }
    }
  }

  var DOOR_MAT = new THREE.MeshStandardMaterial({ color: 0x4a3a68, roughness: 0.55, metalness: 0.15, emissive: 0xffb020, emissiveIntensity: 0.18 });

  function buildLevel() {
    clearGroup(worldGroup);
    rooms = [];
    roomsCleared = [];
    obstacles = [];
    doors = [];
    levelLength = config.rooms * ROOM_WIDTH;

    var floorTex = makeFloorTexture(0x241d33, 0x342850);
    floorTex.repeat.set(levelLength / 1.8, ROOM_DEPTH / 1.8);
    var floorMat = new THREE.MeshStandardMaterial({ map: floorTex, roughness: 0.92, metalness: 0.04 });
    var wallMat = solidMat(0x362a4a, 0.8, 0);
    var windowMat = new THREE.MeshBasicMaterial({ color: 0xffd9a0 });

    var floor = new THREE.Mesh(new THREE.PlaneGeometry(levelLength + 4, ROOM_DEPTH), floorMat);
    floor.rotation.x = -Math.PI / 2;
    floor.position.set(levelLength / 2, 0, 0);
    floor.receiveShadow = true;
    worldGroup.add(floor);

    [-1, 1].forEach(function (side) {
      var wall = new THREE.Mesh(GEO_BOX, wallMat);
      wall.scale.set(levelLength + 4, 2.6, 0.3);
      wall.position.set(levelLength / 2, 1.3, side * (ROOM_DEPTH / 2 + 0.15));
      wall.receiveShadow = true;
      worldGroup.add(wall);
      for (var wx = 3; wx < levelLength; wx += 5) {
        var win = new THREE.Mesh(GEO_BOX, windowMat);
        win.scale.set(1.1, 0.7, 0.06);
        win.position.set(wx, 1.6, side * (ROOM_DEPTH / 2 + 0.14));
        worldGroup.add(win);
      }
    });

    var propTypes = ["desk", "shelf", "plant", "crate"];
    for (var r = 0; r < config.rooms; r++) {
      var roomX0 = r * ROOM_WIDTH;
      rooms.push({ index: r, x0: roomX0, x1: roomX0 + ROOM_WIDTH, cleared: false, enemyIds: [] });
      roomsCleared.push(false);

      // cross wall with doorway gap (not for the very first room's entry side)
      if (r > 0) {
        var gapHalf = 1.1;
        [-1, 1].forEach(function (dz) {
          var segW = (ROOM_DEPTH / 2) - gapHalf;
          var seg = new THREE.Mesh(GEO_BOX, wallMat);
          seg.scale.set(0.3, 2.6, segW);
          seg.position.set(roomX0, 1.3, dz * (gapHalf + segW / 2));
          seg.receiveShadow = true;
          worldGroup.add(seg);
        });
        // sliding door leaves: closed = meet at center (locked = red tint), open = slide into the wall pockets
        var leafHalf = gapHalf * 0.98;
        var leafL = new THREE.Mesh(GEO_BOX, DOOR_MAT);
        leafL.scale.set(0.16, 2.3, leafHalf);
        leafL.castShadow = true; leafL.receiveShadow = true;
        leafL.position.set(roomX0, 1.2, -leafHalf / 2);
        worldGroup.add(leafL);
        var leafR = leafL.clone();
        leafR.position.set(roomX0, 1.2, leafHalf / 2);
        worldGroup.add(leafR);
        doors.push({ x: roomX0, leafL: leafL, leafR: leafR, leafHalf: leafHalf, gatingRoom: r - 1, open: 0 });
      }

      // decoration (collidable — blocks the player and enemies unless jumping)
      var propCount = 2 + Math.floor(Math.random() * 2);
      for (var p = 0; p < propCount; p++) {
        var type = propTypes[Math.floor(Math.random() * propTypes.length)];
        var px = roomX0 + rand(1.5, ROOM_WIDTH - 1.5);
        var pz = (Math.random() < 0.5 ? -1 : 1) * rand(BAND_HALF * 0.55, BAND_HALF * 0.95);
        var propScale = rand(0.85, 1.15);
        var prop = makeProp(type, propScale);
        prop.position.set(px, 0, pz);
        prop.rotation.y = Math.random() * Math.PI * 2;
        prop.traverse(function (o) { if (o.isMesh) { o.castShadow = true; o.receiveShadow = true; } });
        worldGroup.add(prop);
        obstacles.push({ x: px, z: pz, r: PROP_COLLIDE_R[type] * propScale });
      }
    }

    // end gate marker
    var gateMat = solidMat(0x1a1420, 0.8, 0);
    [-1, 1].forEach(function (side) {
      var p = new THREE.Mesh(GEO_CYL, gateMat); p.scale.set(0.25, 2.8, 0.25); p.position.set(levelLength - 0.6, 1.4, side * (ROOM_DEPTH / 2 - 0.3)); worldGroup.add(p);

  function worldToScreen(x, y, z) {
    var v = new THREE.Vector3(x, y, z).project(camera);
    return { x: (v.x * 0.5 + 0.5) * W, y: (1 - (v.y * 0.5 + 0.5)) * H };
  }

  function popupText(x, y, z, text, color) {
    var p = worldToScreen(x, y, z);
    var el = document.createElement("div");
    el.className = "popup";
    el.textContent = text;
    el.style.left = p.x + "px"; el.style.top = p.y + "px";
    if (color) el.style.color = color;
    popupLayer.appendChild(el);
    var t0 = performance.now();
    function anim() {
      var dt = (performance.now() - t0) / 600;
      if (dt >= 1) { el.remove(); return; }
      el.style.transform = "translate(-50%,-50%) translateY(" + (-22 * dt) + "px)";
      el.style.opacity = String(1 - dt);
      requestAnimationFrame(anim);
    }
    requestAnimationFrame(anim);
  }

  function spawnParticles(x, y, z, color, n) {
    for (var i = 0; i < n; i++) {
      var a = Math.random() * Math.PI * 2;
      var s = 1.4 + Math.random() * 2;
      var mesh = new THREE.Mesh(GEO_BOX, new THREE.MeshBasicMaterial({ color: color, transparent: true }));
      mesh.scale.set(0.045, 0.045, 0.045);
      mesh.position.set(x, y, z);
      fxGroup.add(mesh);
      particles.push({ mesh: mesh, vx: Math.cos(a) * s, vz: Math.sin(a) * s, vy: 2 + Math.random() * 1.4, life: 0.35 + Math.random() * 0.25, t: 0 });
    }
  }

  function spawnCash(x, z, amount) {
    var n = Math.min(3, Math.max(1, Math.round(amount / 3)));
    for (var i = 0; i < n; i++) {
      var mesh = new THREE.Mesh(GEO_BOX, solidMat(0x4ade80, 0.5, 0));
      mesh.scale.set(0.18, 0.02, 0.1);
      var px = x + rand(-0.5, 0.5), pz = z + rand(-0.5, 0.5);
      mesh.position.set(px, 0.05, pz);
      fxGroup.add(mesh);
      cashPickups.push({ mesh: mesh, x: px, z: pz, value: Math.round(amount / n), spin: Math.random() * 6 });
    }
  }

  function spawnMuzzleFlash(origin, angle, color) {
    var fx = origin.x + Math.sin(angle) * 0.25, fz = origin.z + Math.cos(angle) * 0.25;
    var mesh = new THREE.Mesh(new THREE.PlaneGeometry(0.22, 0.22), new THREE.MeshBasicMaterial({ color: color || 0xffe9a0, transparent: true, opacity: 0.9, side: THREE.DoubleSide, depthWrite: false }));
    mesh.position.set(fx, origin.y, fz);
    mesh.rotation.y = angle;
    fxGroup.add(mesh);
    muzzleFlashes.push({ mesh: mesh, t: 0, life: 0.09 });
  }

  function spawnShockwave(x, z, color, maxScale) {
    var ring = new THREE.Mesh(new THREE.RingGeometry(0.15, 0.32, 24), new THREE.MeshBasicMaterial({ color: color, transparent: true, opacity: 0.85, side: THREE.DoubleSide, depthWrite: false }));
    ring.rotation.x = -Math.PI / 2;
    ring.position.set(x, 0.06, z);
    fxGroup.add(ring);
    shockwaves.push({ mesh: ring, t: 0, life: 0.4, maxScale: maxScale });
  }

  function enemyShootAtPlayer(e) {
    e.shotT = 0.2;
    var origin = { x: e.x + Math.sin(e.facing) * 0.3, y: 0.9, z: e.z + Math.cos(e.facing) * 0.3 };
    var dx = player.x - origin.x, dz = player.z - origin.z;
    var dd = Math.hypot(dx, dz) || 1;
    var mesh = new THREE.Mesh(new THREE.OctahedronGeometry(0.07, 0), new THREE.MeshStandardMaterial({ color: 0xff6a6a, emissive: 0xff2222, emissiveIntensity: 0.6 }));
    mesh.position.set(origin.x, origin.y, origin.z);
    fxGroup.add(mesh);
    enemyShots.push({ mesh: mesh, x: origin.x, z: origin.z, dirX: dx / dd, dirZ: dz / dd, speed: 12.5, t: 0 });
    spawnMuzzleFlash(origin, e.facing, 0xff6a6a);
  }

  function flashHit() {
    flashEl.style.transition = "none"; flashEl.style.opacity = "0.4";
    requestAnimationFrame(function () {
      flashEl.style.transition = "opacity 0.35s"; flashEl.style.opacity = "0";
    });
  }

  function damagePlayer(dmg) {
    player.hp -= dmg;
    updateHpBar();
    flashHit();
    shakeT = 0.26;
    popupText(player.x, 1.6, player.z, "-" + dmg, "#ff4d6d");
    spawnParticles(player.x, 1, player.z, 0xff4d6d, 10);
    if (player.hp <= 0) endRun(false);
  }

  function killEnemy(e) {
    e.alive = false;
    entitiesGroup.remove(e.vis.root);
    var idx = enemies.indexOf(e);
    if (idx !== -1) enemies.splice(idx, 1);
    var reward = 2 + Math.floor(Math.random() * 3);
    runCashEarned += reward;
    cash += reward;
    cashVal.textContent = cash;
    popupText(e.x, 1.4, e.z, "+" + reward, "#4ade80");
    spawnParticles(e.x, 1, e.z, 0x3a3a52, 12);
    spawnCash(e.x, e.z, reward);
    checkRoomClear();
  }

  function checkRoomClear() {
    var room = rooms[currentRoomIndex];
    var remaining = room.enemyIds.filter(function (e) { return e.alive; });
    if (remaining.length === 0 && !roomsCleared[currentRoomIndex]) {
      roomsCleared[currentRoomIndex] = true;
    }
  }

  function endRun(won) {
    if (missionEnded) return;
    missionEnded = true;
    state = won ? "won" : "dead";
    setTimeout(function () {
      if (won) { contractNumber++; saveMeta(); }
      resultLabel.textContent = won ? "Contract Complete" : "Contract Failed";
      resultCash.textContent = "+" + runCashEarned;
      resultBalance.textContent = "Balance: " + cash;
      primaryBtn.textContent = won ? "NEXT CONTRACT" : "RETRY CONTRACT";
      primaryBtn.onclick = won ? openEquipNext : function () { startRun(player.weapon); };
      showOverlay(resultOverlay);
      hud.style.display = "none"; controlsEl.style.display = "none";
    }, won ? 350 : 420);
  }
  function openEquipNext() { openEquip(); }

  // ---------- Input ----------
  var keys = {};
  function tryJump() {
    if (state === "playing" && !player.jumping) { player.jumping = true; player.jumpT = 0; }
  }
  window.addEventListener("keydown", function (e) {
    keys[e.key.toLowerCase()] = true;
    if (e.key === " " && !e.repeat) { e.preventDefault(); tryJump(); }
  });
  window.addEventListener("keyup", function (e) { keys[e.key.toLowerCase()] = false; });
  jumpBtn.addEventListener("pointerdown", function (e) { e.preventDefault(); tryJump(); });
  function keyboardVector() {
    var x = 0, y = 0;
    if (keys["arrowleft"] || keys["a"]) x -= 1;
    if (keys["arrowright"] || keys["d"]) x += 1;
    if (keys["arrowup"] || keys["w"]) y -= 1;
    if (keys["arrowdown"] || keys["s"]) y += 1;
    return { x: x, y: y };
  }

  var touchVec = { x: 0, y: 0 };
  var joyActive = false, joyOrigin = { x: 0, y: 0 };
  var JOY_R = 50;
  function stageLocal(clientX, clientY) {
    var rect = stage.getBoundingClientRect();
    return { x: clientX - rect.left, y: clientY - rect.top };
  }
  joyZone.addEventListener("pointerdown", function (e) {
    var p = stageLocal(e.clientX, e.clientY);
    joyOrigin = p; joyActive = true;
    joyBase.style.left = p.x + "px"; joyBase.style.top = p.y + "px"; joyBase.style.display = "block";
    joyKnob.style.left = p.x + "px"; joyKnob.style.top = p.y + "px";
    try { joyZone.setPointerCapture(e.pointerId); } catch (err) {}
  });
  joyZone.addEventListener("pointermove", function (e) {
    if (!joyActive) return;
    var p = stageLocal(e.clientX, e.clientY);
    var dx = p.x - joyOrigin.x, dy = p.y - joyOrigin.y;
    var dist = Math.sqrt(dx * dx + dy * dy);
    var clamped = Math.min(dist, JOY_R);
    var ang = Math.atan2(dy, dx);
    var kx = joyOrigin.x + Math.cos(ang) * clamped, ky = joyOrigin.y + Math.sin(ang) * clamped;
    joyKnob.style.left = kx + "px"; joyKnob.style.top = ky + "px";
    touchVec.x = (kx - joyOrigin.x) / JOY_R; touchVec.y = (ky - joyOrigin.y) / JOY_R;
  });
  function endJoy() { joyActive = false; joyBase.style.display = "none"; touchVec.x = 0; touchVec.y = 0; }
  joyZone.addEventListener("pointerup", endJoy);
  joyZone.addEventListener("pointercancel", endJoy);

  // ---------- Loop ----------
  function loop() {
    if (state !== "playing") { renderer.render(scene, camera); return; }
    var dt = Math.min(clock.getDelta(), 0.05);
    update(dt);
    renderer.render(scene, camera);
    requestAnimationFrame(loop);
  }

  function roomBoundsFor(x) {
    for (var i = 0; i < rooms.length; i++) if (x >= rooms[i].x0 && x < rooms[i].x1) return i;
    return rooms.length - 1;
  }

  function update(dt) {
    var kb = keyboardVector();
    var ix = joyActive ? touchVec.x : kb.x;
    var iz = joyActive ? touchVec.y : kb.y;
    var len = Math.sqrt(ix * ix + iz * iz);
    if (len > 1) { ix /= len; iz /= len; }
    player.moving = len > 0.08;

    if (player.cooldown > 0) player.cooldown -= dt;
    if (player.swingT > 0) player.swingT -= dt;

    if (player.moving) {
      var nx = player.x + ix * player.speed * dt;
      var nz = player.z + iz * player.speed * dt;
      // doors are automatic now — just track which room the player is in for spawning/HUD
      var targetRoom = roomBoundsFor(nx);
      if (targetRoom !== currentRoomIndex) {
        currentRoomIndex = targetRoom;
        if (rooms[currentRoomIndex].enemyIds.length === 0) populateRoom(currentRoomIndex);
        roomVal.textContent = "Room " + (currentRoomIndex + 1) + "/" + config.rooms;
      }
      nx = Math.max(0.6, Math.min(levelLength - 0.6, nx));
      nz = Math.max(-BAND_HALF, Math.min(BAND_HALF, nz));
      player.x = nx; player.z = nz;
      if (!player.jumping) resolveObstacles(player, player.collisionR);
      player.facing = Math.atan2(ix, iz);
      player.walkPhase += dt * 9;
    }

    // --- jump arc ---
    var jumpY = 0;
    if (player.jumping) {
      player.jumpT += dt;
      if (player.jumpT >= JUMP_DURATION) { player.jumping = false; player.jumpT = 0; }
      else jumpY = Math.sin((player.jumpT / JUMP_DURATION) * Math.PI) * JUMP_HEIGHT;
    }

    // win check: reached the end of the level (fighting through nets more cash, but isn't required)
    if (player.x > levelLength - 1.4) {
      endRun(true); return;
    }

    // --- auto combat: find nearest living enemy in range ---
    var weapon = player.weapon;
    var target = null, bestDist = Infinity;
    enemies.forEach(function (e) {
      var d = Math.hypot(e.x - player.x, e.z - player.z);
      if (d < bestDist) { bestDist = d; target = e; }
    });
    if (target && bestDist <= weapon.range && player.cooldown <= 0) {
      player.facing = Math.atan2(target.x - player.x, target.z - player.z);
      fireWeapon(target);
      player.cooldown = weapon.cooldown;
      player.swingT = Math.min(weapon.cooldown, 0.22);
    }

    // --- enemies: always alert, close in fast, gunners keep range and shoot ---
    enemies.forEach(function (e) {
      if (e.flash > 0) e.flash -= dt;
      if (e.attackCooldown > 0) e.attackCooldown -= dt;
      var dx = player.x - e.x, dz = player.z - e.z;
      var dist = Math.sqrt(dx * dx + dz * dz) || 0.001;
      var nx2 = dx / dist, nz2 = dz / dist;

      if (e.ranged) {
        e.facing = Math.atan2(dx, dz);
        if (dist < e.keepDist) {
          e.x -= nx2 * e.speed * dt; e.z -= nz2 * e.speed * dt;
          e.walkPhase += dt * 8;
        } else if (dist > e.attackRange * 0.85) {
          e.x += nx2 * e.speed * dt; e.z += nz2 * e.speed * dt;
          e.walkPhase += dt * 8;
        }
        if (dist <= e.attackRange && e.attackCooldown <= 0) {
          enemyShootAtPlayer(e);
          e.attackCooldown = e.attackCooldownBase;
        }
      } else if (dist < e.attackRange) {
        e.facing = Math.atan2(dx, dz);
        if (e.attackCooldown <= 0) { damagePlayer(e.damage); e.attackCooldown = e.attackCooldownBase; }
      } else {
        e.x += nx2 * e.speed * dt; e.z += nz2 * e.speed * dt;
        e.facing = Math.atan2(nx2, nz2);
        e.walkPhase += dt * 9;
      }
      e.x = Math.max(0.3, Math.min(levelLength - 0.3, e.x));
      e.z = Math.max(-BAND_HALF, Math.min(BAND_HALF, e.z));
      resolveObstacles(e, e.collisionR);
    });

    // --- doors: automatic, open for anyone (player or enemy) approaching ---
    doors.forEach(function (d) {
      var near = Math.abs(player.x - d.x) < 2.6;
      if (!near) {
        for (var di = 0; di < enemies.length; di++) {
          if (Math.abs(enemies[di].x - d.x) < 2.2) { near = true; break; }
        }
      }
      d.open += ((near ? 1 : 0) - d.open) * Math.min(dt * 6, 1);
      var slide = d.open * (d.leafHalf + 0.25);
      d.leafL.position.z = -d.leafHalf / 2 - slide;
      d.leafR.position.z = d.leafHalf / 2 + slide;
    });

    // --- projectiles ---
    for (var i = projectiles.length - 1; i >= 0; i--) {
      var pr = projectiles[i];
      pr.t += dt;
      var alive = pr.target && pr.target.alive;
      var faceAngle = Math.atan2(pr.dirX, pr.dirZ);
      if (!alive) {
        pr.x += pr.dirX * pr.speed * dt; pr.z += pr.dirZ * pr.speed * dt;
      } else {
        var ddx = pr.target.x - pr.x, ddz = pr.target.z - pr.z;
        var dd = Math.hypot(ddx, ddz);
        var step = pr.speed * dt;
        if (dd <= step + 0.15) {
          hitWithProjectile(pr);
          fxGroup.remove(pr.mesh);
          projectiles.splice(i, 1);
          continue;
        }
        pr.x += (ddx / dd) * step; pr.z += (ddz / dd) * step;
        faceAngle = Math.atan2(ddx, ddz);
      }
      pr.mesh.position.set(pr.x, 0.9, pr.z);
      if (pr.weapon.kind === "splash") { pr.mesh.rotation.y += dt * 14; pr.mesh.rotation.x += dt * 10; }
      else { pr.mesh.rotation.y = faceAngle; }
      if (pr.t > 2.2) { fxGroup.remove(pr.mesh); projectiles.splice(i, 1); }
    }

    // --- particles ---
    for (i = particles.length - 1; i >= 0; i--) {
      var p = particles[i];
      p.t += dt;
      if (p.t >= p.life) { fxGroup.remove(p.mesh); particles.splice(i, 1); continue; }
      p.mesh.position.x += p.vx * dt; p.mesh.position.z += p.vz * dt;
      p.vy -= 6.5 * dt;
      p.mesh.position.y = Math.max(0.05, p.mesh.position.y + p.vy * dt);
      p.mesh.material.opacity = 1 - p.t / p.life;
    }

    // --- enemy shots ---
    for (i = enemyShots.length - 1; i >= 0; i--) {
      var es = enemyShots[i];
      es.t += dt;
      es.x += es.dirX * es.speed * dt; es.z += es.dirZ * es.speed * dt;
      es.mesh.position.set(es.x, 0.9, es.z);
      es.mesh.rotation.y += dt * 22;
      var pd2 = Math.hypot(es.x - player.x, es.z - player.z);
      if (pd2 < 0.5) {
        damagePlayer(1);
        fxGroup.remove(es.mesh);
        enemyShots.splice(i, 1);
        continue;
      }
      if (es.t > 2.5) { fxGroup.remove(es.mesh); enemyShots.splice(i, 1); }
    }

    // --- muzzle flashes ---
    for (i = muzzleFlashes.length - 1; i >= 0; i--) {
      var mf = muzzleFlashes[i];
      mf.t += dt;
      if (mf.t >= mf.life) { fxGroup.remove(mf.mesh); muzzleFlashes.splice(i, 1); continue; }
      var mfA = 1 - mf.t / mf.life;
      mf.mesh.material.opacity = mfA * 0.9;
      mf.mesh.scale.setScalar(1 + (1 - mfA) * 1.8);
    }

    // --- shockwaves ---
    for (i = shockwaves.length - 1; i >= 0; i--) {
      var sw = shockwaves[i];
      sw.t += dt;
      if (sw.t >= sw.life) { fxGroup.remove(sw.mesh); shockwaves.splice(i, 1); continue; }
      var swA = sw.t / sw.life;
      var swScale = 1 + swA * sw.maxScale;
      sw.mesh.scale.set(swScale, swScale, swScale);
      sw.mesh.material.opacity = 0.85 * (1 - swA);
    }

    // --- cash pickups ---
    for (i = cashPickups.length - 1; i >= 0; i--) {
      var cp = cashPickups[i];
      cp.spin += dt * 3;
      cp.mesh.rotation.y = cp.spin;
      var pd = Math.hypot(cp.x - player.x, cp.z - player.z);
      if (pd < 0.9) {
        cash += cp.value; runCashEarned += cp.value; cashVal.textContent = cash;
        fxGroup.remove(cp.mesh);
        cashPickups.splice(i, 1);
      }
    }

    // --- visuals ---
    player.vis.root.position.set(player.x, jumpY, player.z);
    player.vis.root.rotation.y = player.facing;
    player.vis.shadowMesh.material.opacity = 0.32 * (1 - jumpY / JUMP_HEIGHT * 0.7);
    var shadowSc = 1 - (jumpY / JUMP_HEIGHT) * 0.35;
    player.vis.shadowMesh.scale.set(shadowSc, shadowSc, shadowSc);
    var swingPhase = player.swingT > 0 ? (1 - player.swingT / Math.max(0.01, Math.min(weapon.cooldown, 0.22))) : -1;
    animateCharacter(player.vis, player.walkPhase, player.moving ? 1 : 0.1, swingPhase);

    enemies.forEach(function (e) {
      e.vis.root.position.set(e.x, 0, e.z);
      e.vis.root.rotation.y = e.facing;
      var eSwing = e.ranged && e.shotT > 0 ? (1 - e.shotT / 0.2) : -1;
      animateCharacter(e.vis, e.walkPhase, 1, eSwing);
      if (e.shotT > 0) e.shotT -= dt;
      var lit = e.flash > 0;
      e.vis.root.traverse(function (o) { if (o.isMesh && o.material && o.material.emissive !== undefined) o.material.emissive.setHex(lit ? 0x552211 : 0x000000); });
    });

    if (shakeT > 0) shakeT -= dt;

    camTarget.x += (player.x - camTarget.x) * Math.min(dt * 5, 1);
    camTarget.z += (player.z - camTarget.z) * Math.min(dt * 5, 1);
    var shakeX = shakeT > 0 ? (Math.random() - 0.5) * shakeT * 1.4 : 0;
    var shakeY = shakeT > 0 ? (Math.random() - 0.5) * shakeT * 0.8 : 0;
    camera.position.set(camTarget.x + 1.5 + shakeX, 10.5 + shakeY, 7);
    camera.lookAt(camTarget.x, 0.5, camTarget.z * 0.6);

    sunLight.position.set(camTarget.x + 6, 14, 7);
    sunLight.target.position.set(camTarget.x, 0, 0);
    sunLight.target.updateMatrixWorld();
  }

  function spawnProjectile(origin, target, weapon) {
    var color = weapon.kind === "splash" ? 0xff6a3d : 0xffd84e;
    var mesh;
    if (weapon.kind === "splash") {
      mesh = new THREE.Mesh(GEO_SPHERE, new THREE.MeshStandardMaterial({ color: color, emissive: color, emissiveIntensity: 0.6 }));
      mesh.scale.set(0.12, 0.12, 0.12);
    } else {
      mesh = new THREE.Mesh(new THREE.CylinderGeometry(0.02, 0.02, 0.18, 6), new THREE.MeshBasicMaterial({ color: color }));
      mesh.rotation.x = Math.PI / 2;
    }
    mesh.position.set(origin.x, origin.y, origin.z);
    fxGroup.add(mesh);
    var dx = target.x - origin.x, dz = target.z - origin.z;
    var dd = Math.hypot(dx, dz) || 1;
    mesh.rotation.y = Math.atan2(dx, dz);
    projectiles.push({ mesh: mesh, x: origin.x, z: origin.z, target: target, dirX: dx / dd, dirZ: dz / dd, speed: weapon.projSpeed, t: 0, weapon: weapon });
  }

  function fireWeapon(target) {
    var weapon = player.weapon;
    var origin = { x: player.x + Math.sin(player.facing) * 0.3, y: 0.9, z: player.z + Math.cos(player.facing) * 0.3 };
    if (weapon.kind === "melee") {
      target.hp -= weapon.damage; target.flash = 0.15;
      spawnParticles(target.x, 1, target.z, 0xcf9f78, 5);
      if (target.hp <= 0) killEnemy(target);
      return;
    }
    spawnMuzzleFlash(origin, player.facing, weapon.kind === "splash" ? 0xff8a4a : 0xffe9a0);
    if (weapon.kind === "spread") {
      var nearby = enemies.slice()
        .filter(function (e) { return Math.hypot(e.x - player.x, e.z - player.z) <= weapon.range; })
        .sort(function (a, b) { return Math.hypot(a.x - player.x, a.z - player.z) - Math.hypot(b.x - player.x, b.z - player.z); })
        .slice(0, weapon.pellets);
      if (nearby.length === 0) nearby = [target];
      nearby.forEach(function (t) { spawnProjectile(origin, t, weapon); });
      return;
    }
    spawnProjectile(origin, target, weapon);
  }

  function hitWithProjectile(pr) {
    var weapon = pr.weapon;
    if (weapon.kind === "splash") {
      spawnParticles(pr.x, 1, pr.z, 0xff6a3d, 26);
      spawnShockwave(pr.x, pr.z, 0xff6a3d, weapon.splashRadius * 2.2);
      popupText(pr.x, 1.6, pr.z, "BOOM", "#ff6a3d");
      shakeT = Math.max(shakeT, 0.3);
      enemies.slice().forEach(function (e) {
        var d = Math.hypot(e.x - pr.x, e.z - pr.z);
        if (d <= weapon.splashRadius) {
          e.hp -= weapon.damage; e.flash = 0.2;
          if (e.hp <= 0) killEnemy(e);
        }
      });
    } else {
      if (pr.target && pr.target.alive) {
        pr.target.hp -= weapon.damage; pr.target.flash = 0.15;
        spawnParticles(pr.x, 1, pr.z, 0xcf9f78, 8);
        if (pr.target.hp <= 0) killEnemy(pr.target);
      }
    }
  }

  resize();
  loadingEl.style.display = "none";
  openTitle();
  renderer.render(scene, camera);
})();
</script>
</body>
</html>
