<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<title>Ninja Strike</title>
<style>
  :root {
    --bg-top: #0a0e1a;
    --bg-bottom: #1b0f1f;
    --ground: #120a1c;
    --ground-line: #4a2d63;
    --player: #4ef0e0;
    --player-glow: #2de0ff;
    --enemy: #ff4d5e;
    --enemy-glow: #ff2d44;
    --brute: #ff9a3d;
    --brute-glow: #ff7a1a;
    --gold: #ffd84e;
    --gold-glow: #ffb800;
    --text: #f4f2ff;
    --text-dim: #a89cc9;
    --accent: #7c5cff;
    --panel: rgba(14, 10, 26, 0.85);
    --heart: #ff4d6d;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: var(--bg-bottom);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    touch-action: none;
    color: var(--text);
  }
  #app {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  #stage {
    position: relative;
    width: 100%;
    height: 100%;
    max-width: 480px;
    max-height: 900px;
    background: linear-gradient(180deg, var(--bg-top), var(--bg-bottom));
    overflow: hidden;
  }
  canvas {
    display: block;
    width: 100%;
    height: 100%;
  }
  .hud {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    padding: 18px 20px;
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    pointer-events: none;
    z-index: 5;
  }
  .hud-left { display: flex; flex-direction: column; gap: 6px; }
  .hud-score {
    font-size: 32px;
    font-weight: 800;
    letter-spacing: 0.5px;
    text-shadow: 0 0 18px rgba(124, 92, 255, 0.6);
    line-height: 1;
  }
  .hud-best {
    font-size: 12px;
    color: var(--text-dim);
    font-weight: 600;
  }
  .hearts { display: flex; gap: 5px; margin-top: 2px; }
  .heart-icon { width: 16px; height: 16px; }
  .hud-right { display: flex; flex-direction: column; align-items: flex-end; gap: 8px; }
  .hud-combo {
    font-size: 14px;
    font-weight: 800;
    color: var(--gold);
    text-align: right;
    opacity: 0;
    transition: opacity 0.2s;
    text-shadow: 0 0 10px rgba(255, 184, 0, 0.6);
  }
  .hud-combo.show { opacity: 1; }
  .charges { display: flex; gap: 4px; }
  .charge-pip {
    width: 11px; height: 11px;
    border-radius: 3px;
    background: rgba(255,255,255,0.12);
    border: 1px solid rgba(255,255,255,0.18);
  }
  .charge-pip.full {
    background: var(--gold);
    box-shadow: 0 0 8px var(--gold-glow);
    border-color: transparent;
  }

  .overlay {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
    text-align: center;
    padding: 32px;
    background: radial-gradient(circle at 50% 35%, rgba(124,92,255,0.18), transparent 60%);
    z-index: 10;
  }
  .overlay.hidden { display: none; }
  .title {
    font-size: 40px;
    font-weight: 900;
    letter-spacing: 1px;
    background: linear-gradient(90deg, var(--player), var(--accent));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    margin: 0;
  }
  .subtitle {
    color: var(--text-dim);
    font-size: 14.5px;
    font-weight: 500;
    max-width: 290px;
    line-height: 1.55;
    margin: 0 0 6px;
  }
  .subtitle b { color: var(--text); }
  .btn {
    appearance: none;
    border: none;
    outline: none;
    cursor: pointer;
    font-family: inherit;
    font-weight: 800;
    font-size: 17px;
    letter-spacing: 0.3px;
    color: #10081f;
    background: linear-gradient(135deg, var(--player), var(--accent));
    padding: 14px 36px;
    border-radius: 999px;
    box-shadow: 0 8px 24px rgba(124, 92, 255, 0.45), 0 0 0 1px rgba(255,255,255,0.08) inset;
    transition: transform 0.12s ease;
  }
  .btn:active { transform: scale(0.95); }
  .panel {
    background: var(--panel);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 20px;
    padding: 26px 30px;
    backdrop-filter: blur(6px);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
  }
  .result-score {
    font-size: 54px;
    font-weight: 900;
    color: var(--text);
    line-height: 1;
  }
  .result-label {
    font-size: 12px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--text-dim);
    font-weight: 700;
  }
  .result-best {
    font-size: 14px;
    color: var(--gold);
    font-weight: 700;
    margin-bottom: 4px;
  }
  .hint {
    position: absolute;
    bottom: 26px;
    left: 0;
    right: 0;
    text-align: center;
    font-size: 11.5px;
    color: var(--text-dim);
    pointer-events: none;
    z-index: 5;
    letter-spacing: 0.4px;
    transition: opacity 0.3s;
  }
  .flash {
    position: absolute;
    inset: 0;
    background: var(--enemy-glow);
    opacity: 0;
    pointer-events: none;
    z-index: 6;
  }
  .popup {
    position: absolute;
    font-weight: 900;
    font-size: 20px;
    color: var(--gold);
    text-shadow: 0 0 14px rgba(255,184,0,0.7);
    pointer-events: none;
    z-index: 7;
    transform: translate(-50%, -50%);
  }
</style>
</head>
<body>
<div id="app">
  <div id="stage">
    <canvas id="game"></canvas>
    <div class="flash" id="flash"></div>
    <div id="popupLayer"></div>

    <div class="hud">
      <div class="hud-left">
        <div class="hud-score" id="score">0</div>
        <div class="hud-best" id="bestLine">Best 0</div>
        <div class="hearts" id="hearts"></div>
      </div>
      <div class="hud-right">
        <div class="hud-combo" id="combo">COMBO x1</div>
        <div class="charges" id="charges"></div>
      </div>
    </div>

    <div class="hint" id="hint">TAP TO SLASH&nbsp;&nbsp;·&nbsp;&nbsp;SWIPE UP TO THROW SHURIKEN</div>

    <div class="overlay" id="startOverlay">
      <h1 class="title">NINJA STRIKE</h1>
      <p class="subtitle">Enemies rush in from the right. <b>Tap to slash</b> anyone in reach. <b>Swipe up</b> to throw a shuriken for an instant ranged kill. Don't let them through.</p>
      <button class="btn" id="startBtn">FIGHT</button>
    </div>

    <div class="overlay hidden" id="endOverlay">
      <div class="panel">
        <div class="result-label">Defeated</div>
        <div class="result-score" id="finalScore">0</div>
        <div class="result-best" id="newBest" style="display:none;">NEW BEST!</div>
        <button class="btn" id="retryBtn">FIGHT AGAIN</button>
      </div>
    </div>
  </div>
</div>

<script>
(function () {
  "use strict";

  var canvas = document.getElementById("game");
  var ctx = canvas.getContext("2d");
  var stage = document.getElementById("stage");
  var scoreEl = document.getElementById("score");
  var bestLineEl = document.getElementById("bestLine");
  var comboEl = document.getElementById("combo");
  var heartsEl = document.getElementById("hearts");
  var chargesEl = document.getElementById("charges");
  var flashEl = document.getElementById("flash");
  var hintEl = document.getElementById("hint");
  var popupLayer = document.getElementById("popupLayer");
  var startOverlay = document.getElementById("startOverlay");
  var endOverlay = document.getElementById("endOverlay");
  var startBtn = document.getElementById("startBtn");
  var retryBtn = document.getElementById("retryBtn");
  var finalScoreEl = document.getElementById("finalScore");
  var newBestEl = document.getElementById("newBest");

  var W = 0, H = 0, DPR = 1, groundY = 0;

  var STORAGE_KEY = "ninjaStrikeBest";
  var best = 0;
  try { best = parseInt(localStorage.getItem(STORAGE_KEY), 10) || 0; } catch (e) { best = 0; }
  bestLineEl.textContent = "Best " + best;

  function resize() {
    var rect = stage.getBoundingClientRect();
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = rect.width;
    H = rect.height;
    canvas.width = Math.round(W * DPR);
    canvas.height = Math.round(H * DPR);
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    groundY = H * 0.74;
  }
  window.addEventListener("resize", function () { resize(); if (player) { player.x = W * 0.22; player.y = groundY; } });

  var MAX_HEARTS = 3;
  var MAX_CHARGES = 3;
  var CHARGE_REGEN = 4.5;

  var state = "idle";
  var player = { x: 0, y: 0, size: 0, reach: 0, attackT: 0, hitT: 0, bob: 0 };
  var enemies = [], particles = [], slashes = [], shurikens = [];
  var score, combo, comboTimer, hearts, charges, chargeTimer, elapsed, spawnTimer, spawnInterval, attackCooldown, shakeT;

  function resetGame() {
    player.x = W * 0.22;
    player.y = groundY;
    player.size = Math.min(H * 0.09, W * 0.16);
    player.reach = W * 0.26;
    player.attackT = 0;
    player.hitT = 0;
    player.bob = 0;
    enemies = [];
    particles = [];
    slashes = [];
    shurikens = [];
    score = 0;
    combo = 1;
    comboTimer = 0;
    hearts = MAX_HEARTS;
    charges = MAX_CHARGES;
    chargeTimer = 0;
    elapsed = 0;
    spawnTimer = 0.6;
    spawnInterval = 1.5;
    attackCooldown = 0;
    shakeT = 0;
    scoreEl.textContent = "0";
    comboEl.classList.remove("show");
    renderHearts();
    renderCharges();
    popupLayer.innerHTML = "";
  }

  function renderHearts() {
    var html = "";
    for (var i = 0; i < MAX_HEARTS; i++) {
      var on = i < hearts;
      html += '<svg class="heart-icon" viewBox="0 0 24 24" style="opacity:' + (on ? 1 : 0.22) + '"><path d="M12 21s-7.5-4.6-10.2-9.1C.4 9.1 1.4 5.8 4.4 4.7c2-0.7 4 0 5.3 1.8L12 9.1l2.3-2.6c1.3-1.8 3.3-2.5 5.3-1.8 3 1.1 4 4.4 2.6 7.2C19.5 16.4 12 21 12 21z" fill="' + (on ? "#ff4d6d" : "#6b5b7f") + '"/></svg>';
    }
    heartsEl.innerHTML = html;
  }

  function renderCharges() {
    var html = "";
    for (var i = 0; i < MAX_CHARGES; i++) {
      html += '<div class="charge-pip ' + (i < charges ? "full" : "") + '"></div>';
    }
    chargesEl.innerHTML = html;
  }

  function startRun() {
    resize();
    resetGame();
    state = "playing";
    startOverlay.classList.add("hidden");
    endOverlay.classList.add("hidden");
    hintEl.style.opacity = "1";
    last = performance.now();
    requestAnimationFrame(loop);
  }

  function popupText(x, y, text, color) {
    var el = document.createElement("div");
    el.className = "popup";
    el.textContent = text;
    el.style.left = x + "px";
    el.style.top = y + "px";
    if (color) el.style.color = color;
    popupLayer.appendChild(el);
    var t0 = performance.now();
    function anim() {
      var dt = (performance.now() - t0) / 600;
      if (dt >= 1) { el.remove(); return; }
      el.style.transform = "translate(-50%,-50%) translateY(" + (-24 * dt) + "px)";
      el.style.opacity = String(1 - dt);
      requestAnimationFrame(anim);
    }
    requestAnimationFrame(anim);
  }

  function spawnParticles(x, y, color, n) {
    for (var i = 0; i < n; i++) {
      var a = Math.random() * Math.PI * 2;
      var s = 80 + Math.random() * 180;
      particles.push({
        x: x, y: y,
        vx: Math.cos(a) * s,
        vy: Math.sin(a) * s - 60,
        life: 0.35 + Math.random() * 0.3,
        t: 0,
        color: color,
        size: 2 + Math.random() * 3
      });
    }
  }

  function gainScore(n) {
    score += Math.round(n * combo);
    scoreEl.textContent = String(score);
  }

  function bumpCombo() {
    combo = Math.min(combo + 0.25, 6);
    comboTimer = 2.4;
    comboEl.textContent = "COMBO x" + combo.toFixed(2).replace(/0$/, "").replace(/\.$/, "");
    comboEl.classList.add("show");
  }

  function breakCombo() {
    combo = 1;
    comboTimer = 0;
    comboEl.classList.remove("show");
  }

  function spawnEnemy() {
    var t = elapsed;
    var bruteChance = Math.min(0.1 + t * 0.01, 0.4);
    var isBrute = Math.random() < bruteChance;
    var speed = (isBrute ? H * 0.11 : H * 0.17) + Math.min(t * 1.6, H * 0.12);
    enemies.push({
      x: W + 30,
      y: groundY,
      type: isBrute ? "brute" : "grunt",
      hp: isBrute ? 2 : 1,
      maxHp: isBrute ? 2 : 1,
      size: isBrute ? Math.min(H * 0.095, W * 0.17) : Math.min(H * 0.075, W * 0.135),
      speed: speed,
      walk: Math.random() * 10,
      flash: 0
    });
  }

  function doSlash() {
    if (state !== "playing" || attackCooldown > 0) return;
    attackCooldown = 0.22;
    player.attackT = 0.16;
    hintEl.style.opacity = "0";

    var hitAny = false, kills = 0;
    for (var i = enemies.length - 1; i >= 0; i--) {
      var e = enemies[i];
      var dx = e.x - player.x;
      if (dx <= player.reach && dx > -player.size * 0.4) {
        hitAny = true;
        e.hp -= 1;
        e.flash = 0.15;
        if (e.hp <= 0) {
          killEnemy(i, false);
          kills++;
        } else {
          spawnParticles(e.x, e.y - e.size * 0.5, e.type === "brute" ? "255,154,61" : "255,77,94", 6);
        }
      }
    }
    slashes.push({ t: 0, life: 0.18 });
    if (kills >= 2) {
      popupText(player.x + player.reach * 0.5, player.y - player.size * 1.3, kills + "x STRIKE!", "#ffd84e");
      gainScore(kills * 2);
    }
    if (hitAny) bumpCombo();
  }

  function throwShuriken() {
    if (state !== "playing" || charges <= 0) return;
    // target the frontmost (closest) living enemy ahead of the player
    var target = null;
    for (var i = 0; i < enemies.length; i++) {
      var e = enemies[i];
      if (e.x > player.x - player.size) {
        if (!target || e.x < target.x) target = e;
      }
    }
    charges--;
    renderCharges();
    hintEl.style.opacity = "0";
    shurikens.push({
      x: player.x + player.size * 0.4,
      y: player.y - player.size * 0.55,
      targetObj: target,
      spin: 0,
      speed: W * 1.8
    });
  }

  function killEnemy(index, byShuriken) {
    var e = enemies[index];
    enemies.splice(index, 1);
    var color = e.type === "brute" ? "255,154,61" : "255,77,94";
    spawnParticles(e.x, e.y - e.size * 0.5, color, byShuriken ? 20 : 14);
    gainScore((e.type === "brute" ? 8 : 4));
  }

  function enemyGetsThrough(e) {
    hearts--;
    renderHearts();
    breakCombo();
    shakeT = 0.3;
    flashHit();
    popupText(player.x, player.y - player.size * 1.5, "HIT!", "#ff4d6d");
    spawnParticles(player.x, player.y - player.size * 0.5, "255,77,109", 16);
    if (hearts <= 0) {
      endRun();
    }
  }

  function flashHit() {
    flashEl.style.transition = "none";
    flashEl.style.opacity = "0.4";
    requestAnimationFrame(function () {
      flashEl.style.transition = "opacity 0.35s";
      flashEl.style.opacity = "0";
    });
  }

  function endRun() {
    state = "dead";
    shakeT = 0.4;
    setTimeout(function () {
      finalScoreEl.textContent = String(score);
      var isNew = score > best;
      if (isNew) {
        best = score;
        try { localStorage.setItem(STORAGE_KEY, String(best)); } catch (e) {}
      }
      bestLineEl.textContent = "Best " + best;
      newBestEl.style.display = isNew ? "block" : "none";
      endOverlay.classList.remove("hidden");
    }, 380);
  }

  // input: tap = slash, swipe up = shuriken
  var touchStartY = 0, touchStartT = 0, touchActive = false;

  function onDown(clientY) {
    touchStartY = clientY;
    touchStartT = performance.now();
    touchActive = true;
  }
  function onUp(clientY) {
    if (!touchActive) return;
    touchActive = false;
    var dy = touchStartY - clientY;
    var dt = performance.now() - touchStartT;
    if (dy > 40 && dt < 500) {
      throwShuriken();
    } else {
      doSlash();
    }
  }

  canvas.addEventListener("pointerdown", function (e) {
    if (state === "idle" || state === "dead") { startRun(); return; }
    onDown(e.clientY);
  });
  canvas.addEventListener("pointerup", function (e) { onUp(e.clientY); });
  canvas.addEventListener("pointercancel", function () { touchActive = false; });

  window.addEventListener("keydown", function (e) {
    if (e.key === " " || e.key === "Enter") {
      if (state === "idle" || state === "dead") { startRun(); return; }
      doSlash();
    } else if (e.key === "ArrowUp" || e.key === "w" || e.key === "W") {
      throwShuriken();
    }
  });

  startBtn.addEventListener("click", startRun);
  retryBtn.addEventListener("click", startRun);

  var last = 0;
  function loop(now) {
    if (state !== "playing") {
      if (state === "dead") render();
      return;
    }
    var dt = Math.min((now - last) / 1000, 0.05);
    last = now;
    update(dt);
    render();
    requestAnimationFrame(loop);
  }

  function update(dt) {
    elapsed += dt;
    spawnInterval = Math.max(0.55, 1.5 - elapsed * 0.018);
    player.bob += dt * 4;

    if (attackCooldown > 0) attackCooldown -= dt;
    if (player.attackT > 0) player.attackT -= dt;
    if (player.hitT > 0) player.hitT -= dt;
    if (comboTimer > 0) {
      comboTimer -= dt;
      if (comboTimer <= 0) breakCombo();
    }
    if (charges < MAX_CHARGES) {
      chargeTimer += dt;
      if (chargeTimer >= CHARGE_REGEN) {
        chargeTimer = 0;
        charges++;
        renderCharges();
      }
    }

    spawnTimer += dt;
    if (spawnTimer >= spawnInterval) {
      spawnTimer = 0;
      spawnEnemy();
    }

    var i;
    for (i = enemies.length - 1; i >= 0; i--) {
      var e = enemies[i];
      e.x -= e.speed * dt;
      e.walk += dt * 9;
      if (e.flash > 0) e.flash -= dt;
      if (e.x <= player.x - player.size * 0.3) {
        enemies.splice(i, 1);
        enemyGetsThrough(e);
        if (state !== "playing") return;
      }
    }

    for (i = shurikens.length - 1; i >= 0; i--) {
      var s = shurikens[i];
      s.spin += dt * 24;
      var tx = s.targetObj && enemies.indexOf(s.targetObj) !== -1 ? s.targetObj.x : s.x + 999;
      var ty = s.targetObj && enemies.indexOf(s.targetObj) !== -1 ? s.targetObj.y - s.targetObj.size * 0.5 : s.y;
      if (!s.targetObj || enemies.indexOf(s.targetObj) === -1) {
        s.x += s.speed * dt;
        if (s.x > W + 40) shurikens.splice(i, 1);
        continue;
      }
      var dx = tx - s.x, dy = ty - s.y;
      var dist = Math.sqrt(dx * dx + dy * dy);
      var step = s.speed * dt;
      if (dist <= step + 4) {
        var idx = enemies.indexOf(s.targetObj);
        if (idx !== -1) killEnemy(idx, true);
        shurikens.splice(i, 1);
      } else {
        s.x += (dx / dist) * step;
        s.y += (dy / dist) * step;
      }
    }

    for (i = particles.length - 1; i >= 0; i--) {
      var p = particles[i];
      p.t += dt;
      if (p.t >= p.life) { particles.splice(i, 1); continue; }
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      p.vy += 300 * dt;
      p.vx *= 0.94;
    }

    for (i = slashes.length - 1; i >= 0; i--) {
      slashes[i].t += dt;
      if (slashes[i].t >= slashes[i].life) slashes.splice(i, 1);
    }

    if (shakeT > 0) shakeT -= dt;
  }

  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  function drawNinja(x, y, size, attackT, hitT, bob) {
    var bobY = Math.sin(bob) * size * 0.04;
    ctx.save();
    ctx.translate(x, y + bobY);
    if (hitT > 0) {
      ctx.globalAlpha = 0.5 + Math.sin(hitT * 60) * 0.3;
    }
    ctx.shadowColor = "#2de0ff";
    ctx.shadowBlur = 16;
    // legs
    ctx.fillStyle = "#1c2b3a";
    roundRect(-size * 0.18, -size * 0.1, size * 0.14, size * 0.42, size * 0.05);
    ctx.fill();
    roundRect(size * 0.04, -size * 0.1, size * 0.14, size * 0.42, size * 0.05);
    ctx.fill();
    // body
    ctx.fillStyle = "#4ef0e0";
    roundRect(-size * 0.22, -size * 0.62, size * 0.44, size * 0.56, size * 0.18);
    ctx.fill();
    // head wrap
    ctx.fillStyle = "#213449";
    ctx.beginPath();
    ctx.arc(0, -size * 0.74, size * 0.18, 0, Math.PI * 2);
    ctx.fill();
    // eyes strip
    ctx.fillStyle = "#4ef0e0";
    ctx.fillRect(-size * 0.16, -size * 0.78, size * 0.32, size * 0.07);
    // sword / slash arm
    var swing = attackT > 0 ? (1 - attackT / 0.16) : 0;
    ctx.save();
    ctx.translate(size * 0.2, -size * 0.42);
    ctx.rotate(-0.6 + swing * 1.5);
    ctx.fillStyle = "#dfe8ff";
    ctx.shadowColor = "#9fd8ff";
    ctx.shadowBlur = 10;
    roundRect(0, -size * 0.05, size * 0.5, size * 0.07, size * 0.03);
    ctx.fill();
    ctx.fillStyle = "#2c2440";
    roundRect(-size * 0.08, -size * 0.06, size * 0.1, size * 0.09, size * 0.02);
    ctx.fill();
    ctx.restore();
    ctx.restore();
  }

  function drawEnemy(e) {
    var walkY = Math.sin(e.walk) * e.size * 0.05;
    ctx.save();
    ctx.translate(e.x, e.y + walkY);
    if (e.flash > 0) ctx.globalAlpha = 0.5 + Math.sin(e.flash * 80) * 0.4;
    var baseColor = e.type === "brute" ? "#ff9a3d" : "#ff4d5e";
    var glow = e.type === "brute" ? "#ff7a1a" : "#ff2d44";
    ctx.shadowColor = glow;
    ctx.shadowBlur = 14;
    ctx.fillStyle = "#1c1424";
    roundRect(-e.size * 0.16, -e.size * 0.1, e.size * 0.13, e.size * 0.38, e.size * 0.04);
    ctx.fill();
    roundRect(e.size * 0.03, -e.size * 0.1, e.size * 0.13, e.size * 0.38, e.size * 0.04);
    ctx.fill();
    ctx.fillStyle = baseColor;
    roundRect(-e.size * 0.22, -e.size * 0.58, e.size * 0.44, e.size * 0.52, e.size * 0.16);
    ctx.fill();
    ctx.fillStyle = "#2a1620";
    ctx.beginPath();
    ctx.arc(0, -e.size * 0.68, e.size * 0.16, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = "#fff";
    ctx.fillRect(-e.size * 0.1, -e.size * 0.7, e.size * 0.06, e.size * 0.05);
    ctx.fillRect(e.size * 0.04, -e.size * 0.7, e.size * 0.06, e.size * 0.05);
    ctx.restore();

    if (e.maxHp > 1) {
      var bw = e.size * 0.7;
      var bx = e.x - bw / 2, by = e.y - e.size * 0.95;
      ctx.fillStyle = "rgba(0,0,0,0.4)";
      ctx.fillRect(bx, by, bw, 4);
      ctx.fillStyle = "#ffd84e";
      ctx.fillRect(bx, by, bw * (e.hp / e.maxHp), 4);
    }
  }

  function render() {
    ctx.clearRect(0, 0, W, H);
    ctx.save();
    if (shakeT > 0) {
      var k = shakeT * 16;
      ctx.translate((Math.random() - 0.5) * k, (Math.random() - 0.5) * k);
    }

    // ground
    ctx.strokeStyle = "rgba(124,92,255,0.18)";
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(0, groundY + 2);
    ctx.lineTo(W, groundY + 2);
    ctx.stroke();
    ctx.fillStyle = "rgba(124,92,255,0.05)";
    ctx.fillRect(0, groundY + 2, W, H - groundY);

    // slash reach zone ring when active
    slashes.forEach(function (s) {
      var a = 1 - s.t / s.life;
      ctx.save();
      ctx.globalAlpha = a * 0.55;
      ctx.strokeStyle = "#9fe8ff";
      ctx.lineWidth = 6;
      ctx.beginPath();
      ctx.arc(player.x + player.reach * 0.4, player.y - player.size * 0.4, player.reach * (0.6 + 0.4 * (1 - a)), -0.9, 0.9);
      ctx.stroke();
      ctx.restore();
    });

    enemies.forEach(drawEnemy);

    shurikens.forEach(function (s) {
      ctx.save();
      ctx.translate(s.x, s.y);
      ctx.rotate(s.spin);
      ctx.shadowColor = "#ffb800";
      ctx.shadowBlur = 14;
      ctx.fillStyle = "#ffd84e";
      var r = Math.min(H * 0.022, 10);
      ctx.beginPath();
      for (var k = 0; k < 4; k++) {
        var ang = (Math.PI / 2) * k;
        ctx.lineTo(Math.cos(ang) * r, Math.sin(ang) * r);
        ctx.lineTo(Math.cos(ang + 0.5) * r * 0.35, Math.sin(ang + 0.5) * r * 0.35);
      }
      ctx.closePath();
      ctx.fill();
      ctx.restore();
    });

    particles.forEach(function (p) {
      var a = 1 - p.t / p.life;
      ctx.fillStyle = "rgba(" + p.color + "," + a + ")";
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
      ctx.fill();
    });

    drawNinja(player.x, player.y, player.size, player.attackT, player.hitT, player.bob);

    ctx.restore();
  }

  resize();
  player.x = W * 0.22;
  player.y = groundY;
  player.size = Math.min(H * 0.09, W * 0.16);
  render();
})();
</script>
</body>
</html>
